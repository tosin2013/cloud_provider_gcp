---
- name: Report GCP project information
  agnosticd_user_info:
    msg: "{{ item }}"
  loop:
    - "GCP Project ID: {{ gcp_project_id }}"
    - "GCP Region: {{ gcp_region }}"
    - "GCP Console: https://console.cloud.google.com/home/dashboard?project={{ gcp_project_id }}"

- name: Report GCP project data
  agnosticd_user_info:
    data:
      gcp_project_id: "{{ gcp_project_id }}"
      gcp_region: "{{ gcp_region }}"
      gcp_console_url: "https://console.cloud.google.com/home/dashboard?project={{ gcp_project_id }}"

- name: Report additional messages
  when: gcp_user_info_messages | length > 0
  agnosticd_user_info:
    msg: "{{ item }}"
  loop: "{{ gcp_user_info_messages }}"
