---
- name: Try to detect region from existing instances
  google.cloud.gcp_compute_instance_info:
    zone: "{{ gcp_region | default(gcp_detect_region_fallback) }}-b"
    filters:
      - "labels.guid = {{ guid }}"
    project: "{{ gcp_project_id }}"
    auth_kind: serviceaccount
    service_account_file: "{{ gcp_credentials_output | default(gcp_credentials_file) }}"
  register: r_detect_instances
  failed_when: false

- name: Set region from detected zone
  ansible.builtin.set_fact:
    gcp_region_final: >-
      {{ r_detect_instances.resources[0].zone
         | regex_replace('.*/zones/(.*)-[a-z]$', '\1') }}
  when:
    - r_detect_instances.resources | default([]) | length > 0

- name: Fall back to configured region
  ansible.builtin.set_fact:
    gcp_region_final: "{{ gcp_region | default(gcp_detect_region_fallback) }}"
  when: gcp_region_final is not defined
