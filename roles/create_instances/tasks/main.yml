---
- name: Read SSH provision public key for instance metadata
  when: gcp_ssh_public_key is not defined or gcp_ssh_public_key | length == 0
  block:
    - name: Slurp SSH public key file
      ansible.builtin.slurp:
        src: "{{ ssh_provision_pubkey_path | default(output_dir ~ '/ssh_provision_' ~ guid ~ '.pub') }}"
      register: r_inst_ssh_pubkey

    - name: Set gcp_ssh_public_key from file
      ansible.builtin.set_fact:
        gcp_ssh_public_key: "{{ r_inst_ssh_pubkey.content | b64decode | trim }}"

- name: Create GCE instances
  google.cloud.gcp_compute_instance:
    name: "{{ item.name }}"
    machine_type: "{{ item.instance_type | default(gcp_default_machine_type) }}"
    zone: "{{ item.zone | default(gcp_region ~ '-b') }}"
    project: "{{ gcp_project_id }}"
    auth_kind: serviceaccount
    service_account_file: "{{ gcp_credentials_output | default(gcp_credentials_file) }}"
    network_interfaces:
      - network: "{{ gcp_network }}"
        subnetwork: "{{ gcp_subnet }}"
        access_configs: "{{ (item.public_ip | default(true)) | ternary([{'name': 'External NAT', 'type': 'ONE_TO_ONE_NAT'}], omit) }}"
    disks:
      - auto_delete: true
        boot: true
        initialize_params:
          source_image: "{{ gcp_instance_source_image }}"
          disk_size_gb: "{{ item.rootfs_size | default(gcp_default_disk_size_gb) }}"
          disk_type: "{{ item.disk_type | default(gcp_default_disk_type) }}"
    tags:
      items: "{{ item.tags | default([project_tag]) }}"
    labels:
      guid: "{{ guid }}"
      project: "{{ project_tag }}"
      ansible_group: "{{ item.ansible_group | default(item.name) }}"
    metadata:
      enable-oslogin: "FALSE"
      ssh-keys: "{{ gcp_ssh_key_user | default('gcp-user') }}:{{ gcp_ssh_public_key | default('') }}"
    state: present
  vars:
    gcp_instance_image_project: "{{ item.image_project | default(gcp_default_image_project) }}"
    gcp_instance_image_family: "{{ item.image_family | default(gcp_default_image_family) }}"
    gcp_instance_source_image: "projects/{{ gcp_instance_image_project }}/global/images/family/{{ gcp_instance_image_family }}"
  loop: "{{ instances }}"
  loop_control:
    label: "{{ item.name }}"
  register: r_gcp_instances

- name: Set instances fact
  ansible.builtin.set_fact:
    gcp_created_instances: "{{ r_gcp_instances.results }}"
  when: r_gcp_instances.results | default([]) | length > 0
