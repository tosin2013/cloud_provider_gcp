---
- name: List firewall rules for this network
  google.cloud.gcp_compute_firewall_info:
    filters:
      - "network = {{ gcp_destroy_network_name }}"
    project: "{{ gcp_project_id }}"
    auth_kind: serviceaccount
    service_account_file: "{{ gcp_credentials_output | default(gcp_credentials_file) }}"
  register: r_gcp_firewall_list
  failed_when: false

- name: Delete firewall rules
  google.cloud.gcp_compute_firewall:
    name: "{{ item.name }}"
    project: "{{ gcp_project_id }}"
    auth_kind: serviceaccount
    service_account_file: "{{ gcp_credentials_output | default(gcp_credentials_file) }}"
    state: absent
  loop: "{{ r_gcp_firewall_list.resources | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: false

- name: Delete subnet
  google.cloud.gcp_compute_subnetwork:
    name: "{{ gcp_destroy_subnet_name }}"
    region: "{{ gcp_region }}"
    project: "{{ gcp_project_id }}"
    auth_kind: serviceaccount
    service_account_file: "{{ gcp_credentials_output | default(gcp_credentials_file) }}"
    state: absent
  failed_when: false

- name: Delete Cloud Router
  google.cloud.gcp_compute_router:
    name: "{{ gcp_destroy_router_name }}"
    region: "{{ gcp_region }}"
    project: "{{ gcp_project_id }}"
    auth_kind: serviceaccount
    service_account_file: "{{ gcp_credentials_output | default(gcp_credentials_file) }}"
    state: absent
  failed_when: false

- name: Delete VPC network
  google.cloud.gcp_compute_network:
    name: "{{ gcp_destroy_network_name }}"
    project: "{{ gcp_project_id }}"
    auth_kind: serviceaccount
    service_account_file: "{{ gcp_credentials_output | default(gcp_credentials_file) }}"
    state: absent
  failed_when: false
