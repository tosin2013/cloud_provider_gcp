---
- name: Fetch instances for this GUID
  ansible.builtin.command:
    cmd: >-
      gcloud compute instances list
      --project={{ gcp_project_id }}
      --filter="labels.guid={{ guid }}"
      --format="value(name,zone,status)"
  register: r_lifecycle_list
  changed_when: false

- name: Parse instance list
  ansible.builtin.set_fact:
    _lifecycle_instances: >-
      {{ r_lifecycle_list.stdout_lines | default([])
         | map('split', '\t')
         | list }}

- name: Report status
  when: gcp_lifecycle_action == "status"
  ansible.builtin.debug:
    msg: "Instance {{ item[0] }} in {{ item[1] }}: {{ item[2] }}"
  loop: "{{ _lifecycle_instances }}"
  loop_control:
    label: "{{ item[0] }}"

- name: Stop instances
  when: gcp_lifecycle_action == "stop"
  ansible.builtin.command:
    cmd: >-
      gcloud compute instances stop {{ item[0] }}
      --zone={{ item[1] | regex_replace('.*/zones/', '') }}
      --project={{ gcp_project_id }}
  loop: "{{ _lifecycle_instances }}"
  loop_control:
    label: "{{ item[0] }}"
  changed_when: true

- name: Start instances
  when: gcp_lifecycle_action == "start"
  ansible.builtin.command:
    cmd: >-
      gcloud compute instances start {{ item[0] }}
      --zone={{ item[1] | regex_replace('.*/zones/', '') }}
      --project={{ gcp_project_id }}
  loop: "{{ _lifecycle_instances }}"
  loop_control:
    label: "{{ item[0] }}"
  changed_when: true
