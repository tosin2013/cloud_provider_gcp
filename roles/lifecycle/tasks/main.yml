---
- name: Fetch instances for this GUID
  google.cloud.gcp_compute_instance_info:
    zone: "{{ gcp_region }}-b"
    filters:
      - "labels.guid = {{ guid }}"
    project: "{{ gcp_project_id }}"
    auth_kind: serviceaccount
    service_account_file: "{{ gcp_credentials_output | default(gcp_credentials_file) }}"
  register: r_lifecycle_list
  failed_when: false

- name: Parse instance list
  ansible.builtin.set_fact:
    _lifecycle_instances: "{{ r_lifecycle_list.resources | default([]) }}"

- name: Report status
  when: gcp_lifecycle_action == "status"
  ansible.builtin.debug:
    msg: "Instance {{ item.name }} in {{ item.zone | regex_replace('.*/zones/', '') }}: {{ item.status }}"
  loop: "{{ _lifecycle_instances }}"
  loop_control:
    label: "{{ item.name }}"

- name: Stop instances
  when: gcp_lifecycle_action == "stop"
  google.cloud.gcp_compute_instance:
    name: "{{ item.name }}"
    zone: "{{ item.zone | regex_replace('.*/zones/', '') }}"
    project: "{{ gcp_project_id }}"
    auth_kind: serviceaccount
    service_account_file: "{{ gcp_credentials_output | default(gcp_credentials_file) }}"
    status: TERMINATED
  loop: "{{ _lifecycle_instances }}"
  loop_control:
    label: "{{ item.name }}"

- name: Start instances
  when: gcp_lifecycle_action == "start"
  google.cloud.gcp_compute_instance:
    name: "{{ item.name }}"
    zone: "{{ item.zone | regex_replace('.*/zones/', '') }}"
    project: "{{ gcp_project_id }}"
    auth_kind: serviceaccount
    service_account_file: "{{ gcp_credentials_output | default(gcp_credentials_file) }}"
    status: RUNNING
  loop: "{{ _lifecycle_instances }}"
  loop_control:
    label: "{{ item.name }}"
