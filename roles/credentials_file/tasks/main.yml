---
- name: Validate GCP credentials file is defined
  ansible.builtin.assert:
    that:
      - gcp_credentials_file | default('') | length > 0
    fail_msg: >-
      gcp_credentials_file must be set to the path of the GCP service account JSON key.

- name: Copy GCP credentials to output directory
  ansible.builtin.copy:
    src: "{{ gcp_credentials_file }}"
    dest: "{{ output_dir }}/gcp_credentials.json"
    mode: "0600"
  register: r_gcp_credentials

- name: Set GCP credentials path fact
  ansible.builtin.set_fact:
    gcp_credentials_output: "{{ output_dir }}/gcp_credentials.json"

- name: Check if gcloud is available
  ansible.builtin.command:
    cmd: command -v gcloud
  register: r_gcloud_check
  failed_when: false
  changed_when: false
  check_mode: false

- name: Set gcloud availability fact
  ansible.builtin.set_fact:
    _gcloud_available: "{{ r_gcloud_check.rc == 0 }}"

- name: Activate service account with gcloud
  ansible.builtin.command:
    cmd: >-
      gcloud auth activate-service-account
      --key-file={{ gcp_credentials_output }}
      --project={{ gcp_project_id }}
  changed_when: true
  when:
    - gcp_auth_type == "serviceaccount"
    - _gcloud_available | bool

- name: Note gcloud not available
  when: not (_gcloud_available | bool)
  ansible.builtin.debug:
    msg: >-
      gcloud CLI is not available in this execution environment.
      GCP API calls will use service_account_file authentication
      via google.cloud Ansible modules.
