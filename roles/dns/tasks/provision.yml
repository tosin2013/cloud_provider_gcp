---
- name: Create DNS A records for instances
  google.cloud.gcp_dns_resource_record_set:
    name: "{{ item.name }}.{{ guid }}.{{ base_domain }}."
    managed_zone:
      name: "{{ gcp_dns_zone_name }}"
    type: A
    ttl: "{{ gcp_dns_ttl }}"
    target:
      - "{{ item.public_ip }}"
    project: "{{ gcp_project_id }}"
    auth_kind: serviceaccount
    service_account_file: "{{ gcp_credentials_output | default(gcp_credentials_file) }}"
    state: present
  loop: "{{ gcp_dns_records | default([]) }}"
  loop_control:
    label: "{{ item.name }}.{{ guid }}.{{ base_domain }}"
  failed_when: false
