---
- name: Check if gcloud is already installed
  ansible.builtin.command:
    cmd: command -v gcloud
  register: r_gcloud_check
  failed_when: false
  changed_when: false
  check_mode: false

- name: Set gcloud availability
  ansible.builtin.set_fact:
    _gcloud_available: "{{ r_gcloud_check.rc == 0 }}"

- name: Note gcloud status
  ansible.builtin.debug:
    msg: >-
      {{ 'gcloud CLI is available.' if _gcloud_available | bool
         else 'gcloud CLI is not available. This is expected inside an EE container.
               Roles will use google.cloud Ansible collection modules instead.' }}
