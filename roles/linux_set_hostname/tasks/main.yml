---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}.{{ gcp_set_hostname_domain }}"

- name: Update /etc/hosts with FQDN
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^127\\.0\\.0\\.1"
    line: "127.0.0.1 {{ inventory_hostname }}.{{ gcp_set_hostname_domain }} {{ inventory_hostname }} localhost"
    state: present
