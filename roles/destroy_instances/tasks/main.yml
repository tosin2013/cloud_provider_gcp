---
- name: Fetch GCE instances for this GUID
  google.cloud.gcp_compute_instance_info:
    zone: "{{ gcp_region }}-b"
    filters:
      - "labels.guid = {{ guid }}"
    project: "{{ gcp_project_id }}"
    auth_kind: serviceaccount
    service_account_file: "{{ gcp_credentials_output | default(gcp_credentials_file) }}"
  register: r_gcp_destroy_list
  failed_when: false

- name: Delete GCE instances
  google.cloud.gcp_compute_instance:
    name: "{{ item.name }}"
    zone: "{{ item.zone | regex_replace('.*/zones/', '') }}"
    project: "{{ gcp_project_id }}"
    auth_kind: serviceaccount
    service_account_file: "{{ gcp_credentials_output | default(gcp_credentials_file) }}"
    state: absent
  loop: "{{ r_gcp_destroy_list.resources | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: r_gcp_destroy_list.resources | default([]) | length > 0
