---
- name: Create VPC network
  google.cloud.gcp_compute_network:
    name: "{{ gcp_network_name }}"
    auto_create_subnetworks: false
    project: "{{ gcp_project_id }}"
    auth_kind: serviceaccount
    service_account_file: "{{ gcp_credentials_output | default(gcp_credentials_file) }}"
    state: present
  register: r_gcp_network

- name: Create subnet
  google.cloud.gcp_compute_subnetwork:
    name: "{{ gcp_subnet_name }}"
    ip_cidr_range: "{{ gcp_subnet_cidr }}"
    network: "{{ r_gcp_network }}"
    region: "{{ gcp_region }}"
    project: "{{ gcp_project_id }}"
    auth_kind: serviceaccount
    service_account_file: "{{ gcp_credentials_output | default(gcp_credentials_file) }}"
    state: present
  register: r_gcp_subnet

- name: Create Cloud Router
  google.cloud.gcp_compute_router:
    name: "{{ gcp_router_name }}"
    network: "{{ r_gcp_network }}"
    region: "{{ gcp_region }}"
    project: "{{ gcp_project_id }}"
    auth_kind: serviceaccount
    service_account_file: "{{ gcp_credentials_output | default(gcp_credentials_file) }}"
    state: present
  register: r_gcp_router

- name: Create firewall rules
  google.cloud.gcp_compute_firewall:
    name: "{{ item.name }}"
    network: "{{ r_gcp_network }}"
    allowed: "{{ item.allowed }}"
    direction: "{{ item.direction | default('INGRESS') }}"
    source_ranges: "{{ item.source_ranges | default(omit) }}"
    target_tags: "{{ item.target_tags | default(omit) }}"
    project: "{{ gcp_project_id }}"
    auth_kind: serviceaccount
    service_account_file: "{{ gcp_credentials_output | default(gcp_credentials_file) }}"
    state: present
  loop: "{{ gcp_firewall_rules }}"
  loop_control:
    label: "{{ item.name }}"

- name: Set network facts
  ansible.builtin.set_fact:
    gcp_network: "{{ r_gcp_network }}"
    gcp_subnet: "{{ r_gcp_subnet }}"
