---
- name: Remove project-wide SSH metadata via gcloud
  ansible.builtin.command:
    cmd: >-
      gcloud compute project-info remove-metadata
      --project={{ gcp_project_id }}
      --keys=ssh-keys
  changed_when: true
  failed_when: false
  when: _gcloud_available | default(false) | bool

- name: Note SSH metadata cleanup skipped
  when: not (_gcloud_available | default(false) | bool)
  ansible.builtin.debug:
    msg: >-
      gcloud not available. Project-wide SSH metadata cleanup skipped.
      OpenShift installer manages its own SSH configuration.
