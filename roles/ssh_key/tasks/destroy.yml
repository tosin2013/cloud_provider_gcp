---
- name: Remove project-wide SSH metadata via gcloud
  ansible.builtin.command:
    cmd: >-
      gcloud compute project-info remove-metadata
      --project={{ gcp_project_id }}
      --keys=ssh-keys
  changed_when: true
  failed_when: false
  when: _gcloud_available | default(false) | bool

- name: Remove project-wide SSH metadata via module
  when: not (_gcloud_available | default(false) | bool)
  google.cloud.gcp_compute_project_info:
    project: "{{ gcp_project_id }}"
    auth_kind: serviceaccount
    service_account_file: "{{ gcp_credentials_output | default(gcp_credentials_file) }}"
    metadata:
      items: []
  failed_when: false
