---
- name: Read SSH public key
  ansible.builtin.slurp:
    src: "{{ ssh_provision_pubkey_path | default(output_dir ~ '/' ~ config ~ '_' ~ guid ~ '_key.pub') }}"
  register: r_ssh_pubkey

- name: Set SSH public key fact
  ansible.builtin.set_fact:
    gcp_ssh_public_key: "{{ r_ssh_pubkey.content | b64decode | trim }}"

- name: Set project-wide SSH metadata via gcloud
  ansible.builtin.command:
    cmd: >-
      gcloud compute project-info add-metadata
      --project={{ gcp_project_id }}
      --metadata=ssh-keys="{{ gcp_ssh_key_user }}:{{ gcp_ssh_public_key }}"
  changed_when: true
  when: _gcloud_available | default(false) | bool

- name: Set project-wide SSH metadata via google.cloud module
  when: not (_gcloud_available | default(false) | bool)
  google.cloud.gcp_compute_project_info:
    project: "{{ gcp_project_id }}"
    auth_kind: serviceaccount
    service_account_file: "{{ gcp_credentials_output | default(gcp_credentials_file) }}"
    metadata:
      items:
        - key: ssh-keys
          value: "{{ gcp_ssh_key_user }}:{{ gcp_ssh_public_key }}"
  failed_when: false
  register: r_gcp_ssh_metadata

- name: Fall back to noting SSH key for install-config
  when:
    - not (_gcloud_available | default(false) | bool)
    - r_gcp_ssh_metadata is failed
  ansible.builtin.debug:
    msg: >-
      Could not set project-wide SSH metadata.
      SSH key will be injected via install-config.yaml for OpenShift deployments.
