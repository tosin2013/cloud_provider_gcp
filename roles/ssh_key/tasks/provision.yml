---
- name: Read SSH public key
  ansible.builtin.slurp:
    src: "{{ ssh_provision_pubkey_path | default(output_dir ~ '/' ~ config ~ '_' ~ guid ~ '_key.pub') }}"
  register: r_ssh_pubkey

- name: Set project-wide SSH metadata
  ansible.builtin.command:
    cmd: >-
      gcloud compute project-info add-metadata
      --project={{ gcp_project_id }}
      --metadata=ssh-keys="{{ gcp_ssh_key_user }}:{{ r_ssh_pubkey.content | b64decode | trim }}"
  changed_when: true
